name: Update Hollywood Evolves DNS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update the Hollywood Evolves CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          hostname = "hollywoodevolves.mcpherson.app"
          target = "o0j6ejf0.up.railway.app"
          zone_name = "mcpherson.app"
          token = os.environ.get("CLOUDFLARE_API_TOKEN")
          if not token:
              raise SystemExit("CLOUDFLARE_API_TOKEN is not configured")

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"Cloudflare API returned HTTP {error.code}: {detail[:1000]}")
              if not result.get("success"):
                  raise SystemExit(f"Cloudflare API rejected the request: {result.get('errors')}")
              return result.get("result")

          zones = request("GET", f"/zones?name={urllib.parse.quote(zone_name)}&status=active")
          if len(zones) != 1:
              raise SystemExit(f"Expected one active zone for {zone_name}; found {len(zones)}")
          zone_id = zones[0]["id"]

          records = request("GET", f"/zones/{zone_id}/dns_records?name={urllib.parse.quote(hostname)}")
          if len(records) != 1:
              raise SystemExit(f"Expected one DNS record for {hostname}; found {len(records)}")
          record = records[0]
          if record["type"] not in {"A", "AAAA", "CNAME"}:
              raise SystemExit(f"Refusing to replace unexpected record type {record['type']}")

          payload = {
              "type": "CNAME",
              "name": hostname,
              "content": target,
              "ttl": 1,
              "proxied": bool(record.get("proxied", False)),
          }
          if record.get("comment"):
              payload["comment"] = record["comment"]
          updated = request("PUT", f"/zones/{zone_id}/dns_records/{record['id']}", payload)
          if updated.get("type") != "CNAME" or updated.get("content", "").rstrip(".") != target:
              raise SystemExit("Cloudflare readback did not match the requested CNAME")
          print(json.dumps({
              "success": True,
              "hostname": updated["name"],
              "type": updated["type"],
              "target": updated["content"],
              "proxied": updated.get("proxied"),
          }))
          PY
